name: Terraform Change Risk Analysis

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-risk-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python tests
        run: |
          pytest -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::384268138548:role/aws-iac-risk-engine-dev-github-actions-role   
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan -out=tfplan

      - name: Convert Terraform plan to JSON
        working-directory: terraform/environments/dev
        run: |
          terraform show -json tfplan > tfplan.json

      - name: Upload Terraform plan for risk analysis
        working-directory: terraform/environments/dev
        run: |
          aws s3 cp tfplan.json \
            s3://aws-iac-risk-engine-dev-plans-output/github/${{ github.repository }}/${{ github.sha }}.json

