name: Terraform Change Risk Analysis

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-risk-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python tests
        run: |
          pytest -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("issuer:", claims.get("iss"))
          print("audience:", claims.get("aud"))
          print("subject:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("event_name:", claims.get("event_name"))
          print("ref:", claims.get("ref"))
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::384268138548:role/aws-iac-risk-engine-dev-github-actions-role
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan -out=tfplan

      - name: Convert Terraform plan to JSON
        working-directory: terraform/environments/dev
        run: |
          terraform show -json tfplan > tfplan.json

      - name: Upload Terraform plan for risk analysis
        working-directory: terraform/environments/dev
        run: |
          aws s3 cp tfplan.json \
            s3://aws-iac-risk-engine-dev-plans-output/github/${{ github.repository }}/${{ github.sha }}.json


        
        
      - name: Wait for risk analysis result
        id: risk-result
        shell: bash
        run: |
          echo "Waiting for AWS risk analysis..."

          for attempt in {1..30}; do

            RESULT=$(aws dynamodb scan \
              --table-name aws-iac-risk-engine-dev-analysis-results \
              --filter-expression "commit_sha = :sha" \
              --expression-attribute-values \
              '{":sha":{"S":"${{ github.sha }}"}}' \
              --query 'Items[0]' \
              --output json)

            if [ "$RESULT" != "null" ] && [ "$RESULT" != "{}" ]; then
              echo "$RESULT" > risk-result.json
              echo "Risk result found."
              break
            fi

            echo "Attempt $attempt: result not available yet."
            sleep 10

          done

          if [ ! -f risk-result.json ]; then
            echo "Risk analysis result was not returned in time."
            exit 1
          fi


      - name: Parse risk result
        id: parse-risk
        shell: bash
        run: |
          RISK_SCORE=$(jq -r '.risk_score.N' risk-result.json)
          RISK_LEVEL=$(jq -r '.risk_level.S' risk-result.json)
          DECISION=$(jq -r '.decision.S' risk-result.json)
          ANALYSIS_ID=$(jq -r '.analysis_id.S' risk-result.json)

          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"
          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

          echo "Risk Score: $RISK_SCORE"
          echo "Risk Level: $RISK_LEVEL"
          echo "Decision: $DECISION"




      - name: Comment risk result on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RISK_SCORE: ${{ steps.parse-risk.outputs.risk_score }}
          RISK_LEVEL: ${{ steps.parse-risk.outputs.risk_level }}
          DECISION: ${{ steps.parse-risk.outputs.decision }}
          ANALYSIS_ID: ${{ steps.parse-risk.outputs.analysis_id }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "## Terraform Change Risk Assessment

          | Metric | Result |
          |---|---|
          | Risk Score | **${RISK_SCORE}** |
          | Risk Level | **${RISK_LEVEL}** |
          | Decision | **${DECISION}** |
          | Analysis ID | \`${ANALYSIS_ID}\` |

          AWS automated Terraform change-risk analysis completed."


      - name: Enforce risk decision
        env:
          DECISION: ${{ steps.parse-risk.outputs.decision }}
        run: |
          case "$DECISION" in
            ALLOW)
              echo "Deployment decision: ALLOW"
              ;;

            APPROVAL_REQUIRED)
              echo "Deployment requires manual approval."
              exit 2
              ;;

            BLOCK)
              echo "Deployment blocked by risk analysis."
              exit 1
              ;;

            *)
              echo "Unknown decision: $DECISION"
              exit 1
              ;;
          esac
